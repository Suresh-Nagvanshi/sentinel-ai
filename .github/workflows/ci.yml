name: SentinelAI CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------------------
  # 1. Backend — Spring Boot Maven build & tests
  # -------------------------------------------------------------------------
  backend-build:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: |
          cd backend
          mvn clean test -DforkCount=0

  # -------------------------------------------------------------------------
  # 2. AI Engine — FastAPI pytest (lightweight, no heavy CV deps)
  # -------------------------------------------------------------------------
  ai-engine-check:
    name: Check AI Engine (FastAPI)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements-test.txt

      - name: Install lightweight test dependencies
        run: |
          cd ai-engine
          pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          cd ai-engine
          pytest -v --tb=short

  # -------------------------------------------------------------------------
  # 3. Frontend — React Vite lint + build
  # -------------------------------------------------------------------------
  frontend-build:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint, max-warnings 0)
        run: |
          cd frontend
          npm run lint

      - name: Build (Vite)
        run: |
          cd frontend
          npm run build
