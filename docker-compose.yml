version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: sentinel-ai-engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    networks:
      - sentinel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-sentinel_db}
      - DB_USER=${POSTGRES_USER:-sentinel_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-sentinel_secret_password}
      - AI_ENGINE_URL=http://ai-engine:8000
      - JWT_SECRET=${JWT_SECRET:-9a2f8c4e1b7d5a0f8c3e6b9a2f5d8c1e4f7a0b3c6d9e2f5a8b1c4d7e0f3a6b9c}
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started
    networks:
      - sentinel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres_data:
