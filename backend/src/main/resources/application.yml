server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sentinel-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel_db}
    username: ${DB_USER:sentinel_user}
    password: ${DB_PASSWORD:sentinel_secret_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:9a2f8c4e1b7d5a0f8c3e6b9a2f5d8c1e4f7a0b3c6d9e2f5a8b1c4d7e0f3a6b9c}
  expiration: ${JWT_EXPIRATION_MS:86400000}

ai-engine:
  url: ${AI_ENGINE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
