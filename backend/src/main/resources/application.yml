server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sentinel-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel_db}
    username: ${DB_USER:sentinel_user}
    password: ${DB_PASSWORD:sentinel_secret_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  # In production, override JWT_SECRET with a strong 256-bit env var.
  # The default below is for local development ONLY — never use in prod.
  secret: ${JWT_SECRET:sentinelai-local-dev-secret-key-change-in-production-256bits}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

default-admin:
  email: ${DEFAULT_ADMIN_EMAIL:admin@sentinelai.local}
  password: ${DEFAULT_ADMIN_PASSWORD:Admin@123}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

ai-engine:
  url: ${AI_ENGINE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
