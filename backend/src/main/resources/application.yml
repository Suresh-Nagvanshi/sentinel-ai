server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sentinel-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sentinel_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  # In production, override JWT_SECRET with a strong 256-bit env var.
  # The default below is for local development ONLY — never use in prod.
  secret: ${JWT_SECRET:sentinelai-local-dev-secret-key-change-in-production-256bits}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

default-admin:
  email: ${DEFAULT_ADMIN_EMAIL:admin@sentinelai.local}
  password: ${DEFAULT_ADMIN_PASSWORD:Admin@123}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

ai-engine:
  url: ${AI_ENGINE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
